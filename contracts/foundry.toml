[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 1024

[profile.osaka]
evm_version = "osaka"

[profile.nobls]
evm_version = "cancun" # an EVM without EIP-2537, to prove the verifier fails closed

[lint]
# Tests use cheatcodes and helper names freely; lint the shipped contracts only.
ignore = ["test/**/*.sol"]
